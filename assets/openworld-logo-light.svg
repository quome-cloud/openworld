        <path class="qm-flame" d="M69 213 q-6 12 0 20 q6 -8 0 -20z" fill="#fab219"></path><path class="qm-flame" style="animation-delay:.2s" d="M93 213 q-6 12 0 20 q6 -8 0 -20z" fill="#fab219"></path>
        <!-- feet -->
        <ellipse cx="118" cy="250" rx="26" ry="15" fill="#7c5ceb"></ellipse><ellipse cx="182" cy="252" rx="26" ry="15" fill="#7c5ceb"></ellipse>
        <!-- body + belly -->
        <ellipse cx="150" cy="178" rx="78" ry="82" fill="#8c7ff2"></ellipse>
        <ellipse cx="150" cy="192" rx="52" ry="60" fill="#d6d1fb"></ellipse>
